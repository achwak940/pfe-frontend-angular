<div class="dashboard">
  <div class="header">
    <div class="header-left">
      <h1 class="section-title">
        <i class="fas fa-clipboard-list"></i>
        Créer une nouvelle enquête
      </h1>
    </div>
  </div>

  <form [formGroup]="enqueteForm" (ngSubmit)="onSubmit()" class="survey-form">
    <!-- Titre -->
    <div class="form-group" [class.has-error]="enqueteForm.get('titre')?.touched && enqueteForm.get('titre')?.invalid">
      <label>
        <i class="fas fa-heading"></i>
        Titre <span class="required">*</span>
      </label>
      <div class="input-wrapper">
        <i class="fas fa-pencil-alt input-icon"></i>
        <input type="text" formControlName="titre" placeholder="Ex: Satisfaction client 2024">
      </div>
      <div class="error-message" *ngIf="enqueteForm.get('titre')?.touched && enqueteForm.get('titre')?.invalid">
        <i class="fas fa-exclamation-circle"></i>
        <span *ngIf="enqueteForm.get('titre')?.errors?.['required']">
          Le titre est obligatoire
        </span>
      </div>
    </div>

    <!-- Description -->
    <div class="form-group" [class.has-error]="enqueteForm.get('description')?.touched && enqueteForm.get('description')?.invalid">
      <label>
        <i class="fas fa-align-left"></i>
        Description
      </label>
      <div class="input-wrapper">
        <i class="fas fa-file-alt input-icon"></i>
        <textarea formControlName="description" rows="3" placeholder="Décrivez l'objectif..."></textarea>
      </div>
      <div class="error-message" *ngIf="enqueteForm.get('description')?.touched && enqueteForm.get('description')?.invalid">
        <i class="fas fa-exclamation-circle"></i>
        <span *ngIf="enqueteForm.get('description')?.errors?.['minlength']">
          Minimum 10 caractères ({{enqueteForm.get('description')?.value?.length || 0}}/10)
        </span>
      </div>
    </div>

    <!-- Date Fin -->
    <div class="form-group" [class.has-error]="enqueteForm.get('dateFin')?.touched && enqueteForm.get('dateFin')?.invalid">
      <label>
        <i class="fas fa-calendar-alt"></i>
        Date de fin
      </label>
      <div class="input-wrapper">
        <i class="fas fa-calendar-check input-icon"></i>
        <input type="date" formControlName="dateFin" [min]="today">
      </div>
      <div class="error-message" *ngIf="enqueteForm.get('dateFin')?.touched && enqueteForm.get('dateFin')?.invalid">
        <i class="fas fa-exclamation-circle"></i>
        <span *ngIf="enqueteForm.get('dateFin')?.errors?.['required']">
          Date de fin obligatoire
        </span>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-icon" [disabled]="enqueteForm.invalid">
        <i class="fas fa-plus-circle"></i>
        Créer l'enquête
      </button>
    </div>
  </form>
</div>
