<div class="dashboard">
  <div class="header">
    <div class="header-left">
      <h1 class="section-title">
        <i class="fas fa-clipboard-list"></i>
        Créer une nouvelle enquête
      </h1>
   
    </div>
    
  </div>

  <form [formGroup]="enqueteForm" (ngSubmit)="onSubmit()" class="survey-form">
    <!-- Titre -->
    <div class="form-group">
      <label>
        <i class="fas fa-heading"></i>
        Titre <span class="required">*</span>
      </label>
      <div class="input-wrapper">
        <i class="fas fa-pencil-alt input-icon"></i>
        <input type="text" formControlName="titre" placeholder="Ex: Satisfaction client 2024">
      </div>
      <div *ngIf="isFieldInvalid('titre')" class="text-danger">
        <i class="fas fa-exclamation-circle"></i>
        Titre requis
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label>
        <i class="fas fa-align-left"></i>
        Description
      </label>
      <div class="input-wrapper">
        <i class="fas fa-file-alt input-icon"></i>
        <textarea formControlName="description" rows="3" placeholder="Décrivez l'objectif..."></textarea>
      </div>
    </div>

    <!-- Date Fin -->
    <div class="form-group">
      <label>
        <i class="fas fa-calendar-alt"></i>
        Date de fin
      </label>
      <div class="input-wrapper">
        <i class="fas fa-calendar-check input-icon"></i>
        <input type="date" formControlName="dateFin" [min]="today">
      </div>
    </div>

    <!-- Statut -->
    <div class="form-group">
      <label>
        <i class="fas fa-tag"></i>
        Statut
      </label>
      <div class="input-wrapper">
        <i class="fas fa-chevron-down input-icon"></i>
        <select formControlName="statut">
          <option *ngFor="let key of getStatusKeys()" [value]="status[key]">{{ status[key] }}</option>
        </select>
      </div>
    </div>

    <!-- Type de participation -->
    <div class="form-group large">
      <label>
        <i class="fas fa-users"></i>
        Type de participation <span class="required">*</span>
      </label>
      <div class="participation-options">
        <div *ngFor="let key of getParticipationKeys()" class="participation-option">
          <input type="radio" [value]="participationType[key]" formControlName="typeParticipation" [id]="'part-' + key">
          <i class="fas" [ngClass]="{
            'fa-user-secret': participationType[key] === 'Anonyme',
            'fa-user-check': participationType[key] === 'Identifiée',
            'fa-user-friends': participationType[key] === 'Mixte'
          }"></i>
          <div>
            <strong>{{ participationType[key] }}</strong>
            <small>
              <ng-container [ngSwitch]="participationType[key]">
                <span *ngSwitchCase="'Anonyme'">Réponses totalement anonymes</span>
                <span *ngSwitchCase="'Identifiée'">Participants identifiés</span>
                <span *ngSwitchCase="'Mixte'">Choix anonyme ou identifié</span>
              </ng-container>
            </small>
          </div>
        </div>
      </div>
      <div *ngIf="isFieldInvalid('typeParticipation')" class="text-danger">
        <i class="fas fa-exclamation-circle"></i>
        Sélection obligatoire
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" class="btn btn-outline btn-icon" (click)="saveAsDraft()">
        <i class="fas fa-save"></i>
        Sauvegarder brouillon
      </button>
      <button type="submit" class="btn btn-primary btn-icon" [disabled]="enqueteForm.invalid">
        <i class="fas fa-plus-circle"></i>
        Créer l'enquête
      </button>
    </div>


  </form>
</div>
