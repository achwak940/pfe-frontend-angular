<div class="admin-container">
  <!-- Sidebar fixe -->
  <aside class="sidebar" [class.sidebar-collapsed]="sidebarCollapsed" [class.mobile-open]="mobileMenuOpen">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-chart-pie" style="color: #9D50BB; font-size: 1.8rem;"></i>
        <span class="logo-text" *ngIf="!sidebarCollapsed">Admin<span class="purple">Panel</span></span>
      </div>
      <button class="toggle-sidebar" (click)="toggleSidebar()">
        <i class="fas" [class.fa-chevron-left]="!sidebarCollapsed" [class.fa-chevron-right]="sidebarCollapsed"></i>
      </button>
    </div>

    <div class="user-info" *ngIf="!sidebarCollapsed">
      <div class="user-avatar">
        <i class="fas fa-user-circle"></i>
      </div>
      <div class="user-details">
        <span class="user-name">Admin User</span>
        <span class="user-role">Administrateur</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <a routerLink="/admin-dashboard">
            <i class="fas fa-tachometer-alt"></i>
            <span *ngIf="!sidebarCollapsed">Dashboard Admin</span>
          </a>
        </li>
     
        <li routerLinkActive="active">
          <a routerLink="/gestionEnquete">
            <i class="fas fa-poll"></i>
            <span *ngIf="!sidebarCollapsed">Gestion des enquêtes</span>
          </a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/gestionQuestions">
            <i class="fas fa-question-circle"></i>
            <span *ngIf="!sidebarCollapsed">Gestion des questions</span>
          </a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/AnalyseReporting">
            <i class="fas fa-chart-bar"></i>
            <span *ngIf="!sidebarCollapsed">Analyse & Reporting</span>
          </a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/feedback">
            <i class="fas fa-comment-dots"></i>
            <span *ngIf="!sidebarCollapsed">Feedback & Support</span>
          </a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/QuestionIA">
            <i class="fas fa-robot"></i>
            <span *ngIf="!sidebarCollapsed">Gestion IA</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer" *ngIf="!sidebarCollapsed">
      <div class="footer-item">
        <i class="fas fa-cog"></i>
        <span>Paramètres</span>
      </div>
      <div class="footer-item" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span>Déconnexion</span>
      </div>
    </div>
  </aside>

  <!-- Contenu principal avec header et router-outlet -->
  <main class="main-content" [class.main-expanded]="sidebarCollapsed">
    <!-- Header avec titre de la page actuelle -->
    <header class="content-header">
      <div class="header-left">
        <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
          <i class="fas fa-bars"></i>
        </button>
        <h1>{{ getPageTitle() }}</h1>
      </div>
      <div class="header-right">
        <div class="header-search">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Rechercher...">
        </div>
        <div class="header-notifications">
          <i class="fas fa-bell"></i>
          <span class="notification-badge">3</span>
        </div>
        <div class="header-user">
          <i class="fas fa-user-circle"></i>
          <span class="user-name">Admin</span>
        </div>
      </div>
    </header>

    <!-- Zone de contenu dynamique -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Mobile menu overlay -->
<div class="mobile-menu-overlay" *ngIf="mobileMenuOpen" (click)="closeMobileMenu()"></div>
